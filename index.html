<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maqueta interactiva — Placa madre</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17212d}*{box-sizing:border-box}body{margin:0;background:#101820}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#1e293b}#fallback{position:fixed;inset:0;background:linear-gradient(135deg,#344256,#15202b);color:white;display:grid;place-items:center;text-align:center;padding:20px}header{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;color:white;background:linear-gradient(#0009,transparent);font-weight:700;text-shadow:0 1px 2px #000}main{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:auto;background:#ffffffed;border-radius:18px;box-shadow:0 12px 40px #0008;overflow:hidden;max-height:78vh;overflow-y:auto}main.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;background:#1663a7;color:white;padding:12px 16px}.top h1{font-size:20px;margin:0}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}#close{background:#ffffff22;color:white;font-size:20px;padding:4px 10px}.content{padding:16px}.visual{font-size:42px;text-align:center;background:#e8f2fb;border-radius:12px;padding:12px}.content p{font-size:14px;line-height:1.45;margin:10px 0}.content strong{color:#125489}#open{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 5px 20px #0008;display:none}#start{background:#1663a7;color:white;margin:12px}#hint{font-size:14px}select{padding:8px;border-radius:8px;max-width:100%}footer{font-size:11px;color:#475569;margin-top:10px}
</style>
</head><body>
<div id="fallback"><div><div style="font-size:48px">📷</div><h2>Maqueta interactiva</h2><p id="hint">Activa la cámara para ver la maqueta detrás de la información.</p><button id="start">Activar cámara</button></div></div>
<video id="camera" autoplay muted playsinline></video>
<header>PLACA MADRE · MAQUETA INTERACTIVA</header>
<main id="card"><div class="top"><h1 id="name">SATA</h1><button id="close" aria-label="Cerrar">×</button></div><div class="content"><div class="visual" id="visual">💾</div><p><strong>¿Qué es?</strong> <span id="what"></span></p><p><strong>¿Qué hace?</strong> <span id="does"></span></p><p><strong>¿Dónde se conecta?</strong> <span id="where"></span></p><p><strong>Ejemplo:</strong> <span id="example"></span></p><label for="choose">Ver otro componente: </label><select id="choose"></select><footer>El fondo es video en directo de tu cámara. No se graba ni se envía.</footer></div></main>
<button id="open">Ver información</button>
<script>
const info={
 sata:['SATA','💾','Interfaz para conectar discos HDD y SSD SATA.','Transfiere datos entre el almacenamiento y la computadora.','Al puerto SATA de la placa madre con un cable de datos; el disco también necesita alimentación.','Abrir una foto guardada en un SSD SATA.'],
 cpu:['CPU','🧠','Es el procesador principal de la computadora.','Ejecuta instrucciones y realiza cálculos.','Se instala en el socket de la placa madre y recibe energía regulada del VRM.','Procesar las instrucciones de un videojuego.'],
 ram:['RAM','🟩','Memoria temporal de trabajo de la computadora.','Mantiene datos de programas abiertos para que la CPU los consulte rápidamente.','En las ranuras DIMM de la placa madre.','Mantener abiertas varias pestañas del navegador.'],
 vrm:['VRM','⚡','Módulo regulador de voltaje.','Convierte y estabiliza la energía que utiliza la CPU.','Está integrado en la placa madre, normalmente cerca del socket.','Entregar al procesador un voltaje adecuado.'],
 cmos:['CMOS','🔋','Circuitería tradicionalmente asociada a los ajustes del BIOS; la pila mantiene el reloj.','Ayuda a conservar la hora y, en diseños antiguos, configuraciones cuando el equipo está apagado.','En la placa madre, cerca de la pila tipo moneda.','Que la computadora recuerde la hora al apagarla.'],
 m2:['M.2','📦','Formato de ranura compacta usado, entre otros dispositivos, por SSD.','Conecta unidades de almacenamiento directamente a la placa; algunas usan NVMe/PCIe.','En una ranura M.2 de la placa madre, normalmente fijada con tornillo.','Instalar un SSD NVMe para abrir programas rápidamente.'],
 io:['I/O Ports','🔌','Puertos de entrada y salida de la computadora.','Permiten conectar periféricos y transferir datos, audio o video.','En el panel trasero de la placa madre y, según el equipo, en conectores frontales.','Conectar un teclado USB o un monitor.']};
const $=id=>document.getElementById(id),sel=$('choose');Object.entries(info).forEach(([id,v])=>{const o=document.createElement('option');o.value=id;o.textContent=v[0];sel.append(o)});
function show(id){if(!info[id])id='sata';const v=info[id];['name','visual','what','does','where','example'].forEach((key,i)=>$(key).textContent=v[i]);sel.value=id;history.replaceState(null,'','#'+id);$('card').classList.remove('hidden');$('open').style.display='none'}
sel.onchange=()=>show(sel.value);$('close').onclick=()=>{$('card').classList.add('hidden');$('open').style.display='block'};$('open').onclick=()=>show(sel.value);show(location.hash.slice(1).toLowerCase());
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('El navegador no admite acceso a cámara o falta HTTPS.');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('camera').srcObject=stream;$('fallback').style.display='none'}catch(e){$('hint').textContent='No se pudo abrir la cámara: '+e.message+' Puedes consultar las fichas sin cámara.'}};
</script></body></html>
